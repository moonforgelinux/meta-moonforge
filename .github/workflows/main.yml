name: main
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  pull_request_target:
    branches:
      - main
    paths-ignore:
      - '**.md'
    types:
      - labeled
env:
  REF_NAME: ${{ github.event.pull_request.number || 'main' }}

jobs:
  build:
    if: >
      github.event.repository.fork == false && (
      github.event_name == 'push' || (
      github.event_name == 'pull_request_target' &&
      github.event.label.name == 'build'))
    runs-on: [self-hosted, builder]
    permissions:
      contents: read
    strategy:
      matrix:
        machine:
          - qemux86-64
          - raspberrypi5
        variant:
          - base
          - full
          - alt
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: moonforgelinux/build-moonforge-action@990696f671bd414f4396d41db9c9fc35040f8a14 #v0.1.1
        with:
          kas_file: kas/examples/moonforge-image-${{ matrix.variant }}-${{ matrix.machine }}.yml:kas/common/debug.yml:kas/common/throttle.yml
          dl_dir: ${{ vars.DL_DIR }}
          sstate_dir: ${{ vars.SSTATE_DIR }}
          image_id: ${{ matrix.variant }}-${{ matrix.machine }}-${{ env.REF_NAME }}
          image_version: ${{ github.run_id }}
      - uses: moonforgelinux/upload-moonforge-action@d81e5795bf561735e2331b3d7705884f170dfff9 #v0.2.1
        with:
          host_base: ${{ secrets.S3_HOST_BASE }}
          access_key: ${{ secrets.S3_ACCESS_KEY }}
          secret_key: ${{ secrets.S3_SECRET_KEY }}
          bucket: ${{ secrets.S3_BUCKET }}
          source: build/tmp/deploy/images/${{ matrix.machine }}
          destination: meta-moonforge/${{ env.REF_NAME }}/${{ github.run_id }}/${{ matrix.variant }}/
          exclude: '*'
          include: '*.wic.*'

  publish:
    if: github.event_name == 'pull_request_target'
    runs-on: [self-hosted, builder]
    needs: build
    permissions:
      pull-requests: write
    steps:
      - uses: mshick/add-pr-comment@ffd016c7e151d97d69d21a843022fd4cd5b96fe5 #v3.9.0
        with:
          message-id: ${{ github.run_id }}
          message-success: |
            Successfully built [${{ github.run_id }}](${{ vars.S3_PUBLIC_URL }}/meta-moonforge/${{ env.REF_NAME }}/${{ github.run_id }}/) :rocket:
